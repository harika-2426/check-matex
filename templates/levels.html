<!DOCTYPE html>
<html>

<head>
<title>Select Level</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>Check MateX</h1>
<h3>Select Level</h3>

<div class="levelsContainer">

<!-- Loop through levels 1 to 5 -->
{% for i in range(1,6) %}

{% if i <= unlocked %}

<button class="levelBtn" id="level{{i}}" onclick="startGame({{i}})">
Level {{i}}
</button>

{% else %}

<button class="levelBtn locked" id="level{{i}}" disabled>
🔒 Level {{i}}
</button>

{% endif %}

{% endfor %}

</div>

<script>

// Load unlocked levels from localStorage
let unlockedLevel = parseInt(localStorage.getItem("unlockedLevel")) || 1

// Enable only unlocked levels
for(let i=1; i<=5; i++){
    let btn = document.getElementById("level"+i)
    if(btn){
        if(i <= unlockedLevel){
            btn.disabled = false
        } else {
            btn.disabled = true
        }
    }
}

// Function to start game
function startGame(level){
    localStorage.setItem("currentLevel", level)
    window.location.href="/game/ai/" + level
}

</script>

</body>
</html>
