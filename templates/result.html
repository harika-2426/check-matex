<!DOCTYPE html>
<html>

<head>

<title>Game Result</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<h1>Game Result</h1>

<!-- RESULT MESSAGE -->

{% if result == "win" %}

<h2>🏆 You Win!</h2>

<div id="aiButtons">

<button onclick="nextLevel()">Next Level</button>

<button onclick="retry()">Play Again</button>

</div>

{% elif result == "lose" %}

<h2>❌ You Lose</h2>

<button onclick="retry()">Retry</button>

{% elif result == "draw" %}

<h2>🤝 Draw</h2>

<button onclick="retry()">Play Again</button>

{% elif result == "checkmate" %}

<h2>♟ Checkmate!</h2>

<button onclick="retry()">Play Again</button>

{% else %}

<h2>{{result}}</h2>

{% endif %}

<br><br>

<div id="pvpButtons" style="display:none">

<button onclick="playAgain()">Play Again</button>

</div>

<button onclick="home()">Home</button>

<script>

let mode = localStorage.getItem("mode")
let level = parseInt(localStorage.getItem("level")) || 1
let unlocked = parseInt(localStorage.getItem("unlockedLevel")) || 1

// PLAYER VS PLAYER BUTTON
if(mode === "pvp"){
document.getElementById("pvpButtons").style.display = "block"
}

// NEXT LEVEL FUNCTION
function nextLevel(){

let next = level + 1

if(next > unlocked){
localStorage.setItem("unlockedLevel", next)
}

localStorage.setItem("level", next)

window.location.href="/levels"

}

// RETRY GAME
function retry(){

window.location.href="/game"

}

// PLAY AGAIN FOR PVP
function playAgain(){

window.location.href="/game"

}

// GO HOME
function home(){

window.location.href="/"

}

</script>

</body>

</html>
